name: 打包 Windows EXE

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest      # 使用 GitHub 的 Windows 服务器
    steps:
      - uses: actions/checkout@v3

      - name: 安装 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install pyinstaller Pillow

      - name: 打包 EXE
        run: |
          pyinstaller --onefile --windowed --name DOCX压缩工具 docx_compressor.py

      - name: 上传 EXE 文件
        uses: actions/upload-artifact@v3
        with:
          name: DOCX压缩工具-Windows
          path: dist/DOCX压缩工具.exe  # 打包好的 EXE
