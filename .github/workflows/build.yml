name: 自动打包 Windows EXE 与 macOS APP

on:
  push:
    branches: [ main ]          # 提交到 main 分支触发
  workflow_dispatch:             # 支持在 Actions 页面手动点击触发

jobs:

  # ──────────────────────────────────────────
  # 1. 打包 Windows .exe
  # ──────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install Pillow PyMuPDF pyinstaller

      - name: 使用 PyInstaller 打包 EXE
        # 🛑 核心修复：添加 --collect-all pymupdf 收集 PyMuPDF 隐藏的数据文件
        run: |
          pyinstaller --onefile --windowed --collect-all pymupdf --name "docx_compressor" docx_compressor.py

      - name: 上传 Windows 产物到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docx_compressor_Windows_x64
          path: dist/docx_compressor.exe
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────
  # 2. 打包 macOS .app (ZIP)
  # ──────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖库
        run: |
          python3 -m pip install --upgrade pip
          pip3 install Pillow PyMuPDF pyinstaller

      - name: 使用 PyInstaller 打包 APP
        # 🛑 核心修复：添加 --collect-all pymupdf
        run: |
          pyinstaller --onefile --windowed --collect-all pymupdf --name "docx_compressor" docx_compressor.py

      - name: 压缩 .app 为 zip 文件
        run: |
          cd dist
          zip -r docx_compressor_macOS.zip docx_compressor.app

      - name: 上传 macOS 产物到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docx_compressor_macOS
          path: dist/docx_compressor_macOS.zip
          if-no-files-found: error
          retention-days: 30
