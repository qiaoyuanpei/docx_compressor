name: 打包 Windows EXE

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4          # v3 → v4

      - name: 安装 Python
        uses: actions/setup-python@v5      # v4 → v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install pyinstaller Pillow

      - name: 打包 EXE
        run: |
          pyinstaller --onefile --windowed --name DOCX压缩工具 docx_compressor.py

      - name: 上传 EXE 文件
        uses: actions/upload-artifact@v4   # v3 → v4 ← 这是报错的根本原因
        with:
          name: DOCX压缩工具-Windows
          path: dist/DOCX压缩工具.exe
